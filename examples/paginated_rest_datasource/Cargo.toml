[package]
name = "paginated_rest_datasource"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.9.0-beta2", features = ["csr"] }
leptos-use = { git = "https://github.com/EvanCarroll/leptos-use.git", branch = "leptos-0.9-resync" }
leptos-struct-table = { path = "../.." }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
gloo-net = { version = "0.7.0", features = ["http"] }
