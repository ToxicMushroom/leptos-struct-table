[package]
edition = "2021"
name = "generic"
version = "0.1.0"

[dependencies]
chrono = { version = "0.4" }
console_error_panic_hook = "0.1"
console_log = "1"
leptos = { version = "0.9.0-beta2", features = ["csr"] }
leptos-struct-table = { path = "../..", features = ["chrono", "uuid"] }
log = "0.4"
uuid = { version = "1.27", features = ["js", "v4"] }

[dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = "0.3"
